/* Playback never contacts a speech service. Parent media always has priority. */
const AudioEngine={
 ctx:null,active:null,voice:null,voices:[],seq:0,lastSource:"",
 initVoices(){
  if(!("speechSynthesis" in window)){this.voices=[];this.voice=null;return}
  this.voices=speechSynthesis.getVoices().filter(v=>/^ko(?:[-_]|$)/i.test(v.lang)&&v.localService===true);
  this.voice=this.voices.find(v=>v.voiceURI===settings.voiceURI)||this.voices[0]||null;
 },
 unlock(){
  try{
   const C=window.AudioContext||window.webkitAudioContext;
   if(C&&!this.ctx)this.ctx=new C();
   if(this.ctx?.state==="suspended")this.ctx.resume().catch(()=>{});
  }catch{}
 },
 stop(){
  ++this.seq;
  if("speechSynthesis" in window)speechSynthesis.cancel();
  if(this.active){try{this.active.pause?.();this.active.stop?.()}catch{}}
  $$("audio").forEach(a=>a.pause());
  this.active=null;
 },
 badge(text){this.lastSource=text;const b=$("#audio-source");if(b)b.textContent=text},
 keyFor(key){
  if(media.has(key))return key;
  const a="ai:"+settings.aiVoice+":"+key;
  if(settings.voiceSource==="ai"&&media.has(a))return a;
  return null;
 },
 async decode(key,uri){
  if(audioBuffers.has(key))return audioBuffers.get(key);
  if(!this.ctx)return null;
  try{
   const bytes=await uriToBlob(uri).arrayBuffer();
   const buffer=await this.ctx.decodeAudioData(bytes);
   if(media.get(key)===uri)audioBuffers.set(key,buffer);
   return buffer;
  }catch{return null}
 },
 async playURI(key,uri,seq){
  /* Calling play synchronously from a user tap avoids losing iOS activation. */
  const ready=audioBuffers.get(key);
  if(ready&&this.ctx?.state==="running"){
   const node=this.ctx.createBufferSource();node.buffer=ready;node.connect(this.ctx.destination);
   this.active=node;node.onended=()=>{if(seq===this.seq)this.active=null};node.start();return true;
  }
  const a=new Audio(uri);a.preload="auto";a.setAttribute("playsinline","");this.active=a;
  a.onended=()=>{if(seq===this.seq)this.active=null};
  try{
   const play=a.play();
   if(play){let timer;try{await Promise.race([play,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error("audio-start-timeout")),2500)})])}finally{clearTimeout(timer)}}
   if(seq!==this.seq){a.pause();return false}
   return true;
  }catch{
   a.pause();
   if(seq!==this.seq)return false;
   const buffer=await this.decode(key,uri);
   if(seq!==this.seq)return false;
   if(buffer&&this.ctx?.state==="running"){
    const node=this.ctx.createBufferSource();node.buffer=buffer;node.connect(this.ctx.destination);
    this.active=node;node.onended=()=>{if(seq===this.seq)this.active=null};node.start();return true;
   }
   return false;
  }
 },
 async playSavedOnly(key){
  this.unlock();this.stop();const seq=this.seq,uri=media.get(key);
  if(!uri){toast("저장된 녹음이 없어요.");return false}
  this.badge(key.startsWith("ai:")?"AI 합성음성 · "+key.split(":")[1]:"저장된 부모·기존 녹음");
  const ok=await this.playURI(key,uri,seq);
  if(!ok&&seq===this.seq)toast("녹음은 저장되어 있지만 재생되지 않았어요. 아래 재생 버튼 또는 내보낸 파일로 확인해 주세요.");
  return ok;
 },
 async say(text,key,opts={}){
  this.unlock();this.stop();const seq=this.seq;
  const chosen=opts.deviceOnly?null:(opts.aiOnly?("ai:"+settings.aiVoice+":"+key):this.keyFor(key));
  if(chosen&&media.has(chosen)){
   const isAI=chosen.startsWith("ai:");
   this.badge(isAI?"AI 합성음성 · "+(DATA.aiVoices.find(v=>v.id===chosen.split(":")[1])?.label||chosen.split(":")[1]):"부모·기존 녹음");
   if(await this.playURI(chosen,media.get(chosen),seq))return;
   if(seq!==this.seq)return;
   toast("저장 음성 재생을 시작하지 못해 기기 음성으로 읽습니다.");
  }
  if(seq!==this.seq)return;
  this.initVoices();
  if(!this.voice){
   this.badge("소리 준비 필요 · 부모 설정 → 음성 선택");
   toast("사용 가능한 한국어 음성이 없어요. 부모 녹음 또는 저장된 AI 음성팩을 준비해 주세요.");return;
  }
  const u=new SpeechSynthesisUtterance(text);u.lang="ko-KR";u.voice=this.voice;u.rate=settings.rate;u.pitch=settings.pitch;u.volume=1;
  u.onend=()=>{if(seq===this.seq)this.active=null};
  u.onerror=e=>{if(seq===this.seq&&!["interrupted","canceled"].includes(e.error))toast("기기 음성 재생을 확인해 주세요. 저장된 녹음은 따로 재생할 수 있어요.")};
  this.badge("기기 합성음성 · "+this.voice.name+(settings.voiceSource==="ai"&&!opts.deviceOnly?" (이 항목의 AI 음성 미준비)":""));
  this.active=u;speechSynthesis.speak(u);
 },
 async warm(keys=[]){
  if(!this.ctx)return;
  for(const key of keys){const actual=this.keyFor(key);if(actual)await this.decode(actual,media.get(actual))}
 }
};



/* IndexedDB v1 is kept for in-place upgrades from 1.0/1.1. */
function openDB(){
 return new Promise((resolve,reject)=>{
  if(!window.indexedDB)return reject(Error("no-indexeddb"));
  let settled=false,req;
  const finish=(error)=>{if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve()};
  const timer=setTimeout(()=>finish(Error("storage-open-timeout")),10000);
  try{req=indexedDB.open("word-garden",1)}catch(e){finish(e);return}
  req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("media"))req.result.createObjectStore("media",{keyPath:"id"})};
  req.onerror=()=>finish(req.error||Error("storage-open"));
  req.onblocked=()=>finish(Error("storage-blocked"));
  req.onsuccess=()=>{
   if(settled){req.result.close();return}
   db=req.result;
   db.onversionchange=()=>{db.close();db=null;storageOK=false;toast("다른 창에서 저장소를 갱신했어요. 이 앱을 다시 열어주세요.")};
   db.onclose=()=>{db=null;storageOK=false};
   try{
    const tx=db.transaction("media","readonly"),request=tx.objectStore("media").getAll();let rows=[];
    request.onsuccess=()=>{rows=request.result};
    tx.oncomplete=()=>{
     media=new Map();mediaMeta=new Map();
     for(const row of rows)if(row&&typeof row.id==="string"&&typeof row.value==="string"){media.set(row.id,row.value);mediaMeta.set(row.id,row)}
     storageOK=true;finish();
    };
    tx.onabort=()=>finish(tx.error||Error("storage-load"));
    tx.onerror=()=>finish(tx.error||Error("storage-load"));
   }catch(e){finish(e)}
  };
 });
}
function dbTransaction(mode="readonly"){
 if(!db)throw Error("storage-unavailable");
 if(mode==="readwrite"){try{return db.transaction("media",mode,{durability:"strict"})}catch(e){if(e.name!=="TypeError"&&e.name!=="NotSupportedError")throw e}}
 return db.transaction("media",mode);
}
function readMediaRecord(id){
 return new Promise((resolve,reject)=>{
  let tx;try{tx=dbTransaction()}catch(e){reject(e);return}
  let value;const req=tx.objectStore("media").get(id);
  req.onsuccess=()=>value=req.result;
  tx.oncomplete=()=>resolve(value);
  tx.onabort=()=>reject(tx.error||Error("read-aborted"));
  tx.onerror=()=>reject(tx.error||Error("read-failed"));
 });
}
function commitRecords(rows){
 return new Promise((resolve,reject)=>{
  let tx;try{tx=dbTransaction("readwrite");for(const row of rows)tx.objectStore("media").put(row)}catch(e){try{tx?.abort()}catch{}reject(e);return}
  tx.oncomplete=()=>resolve();
  tx.onabort=()=>reject(tx.error||Error("write-aborted"));
  tx.onerror=()=>reject(tx.error||Error("write-failed"));
 });
}
function putMedia(id,value,meta={}){
 const task=storageWrite.catch(()=>{}).then(async()=>{
  if(typeof value!=="string"||!value.startsWith("data:"))throw Error("invalid-media");
  const old=await readMediaRecord(id);
  const updatedAt=new Date().toISOString();
  const row={id,value,updatedAt,verifiedAt:updatedAt,source:meta.source||"local",duration:meta.duration||0,mime:meta.mime||value.slice(5).split(";")[0],bytes:meta.bytes||Math.floor(value.length*.75)};
  // One previous parent take, never a recursively expanding history.
  if(meta.source==="parent"&&old?.value&&old.value!==value){row.previous=old.value;row.previousDuration=old.duration||0}
  await commitRecords([row]);
  const check=await readMediaRecord(id);
  if(!check||check.value!==value||check.updatedAt!==updatedAt)throw Error("readback-mismatch");
  media.set(id,check.value);mediaMeta.set(id,check);audioBuffers.delete(id);
  return check;
 });
 storageWrite=task;return task;
}
function removeMedia(id){
 const task=storageWrite.catch(()=>{}).then(async()=>{
  await new Promise((resolve,reject)=>{
   let tx;try{tx=dbTransaction("readwrite");tx.objectStore("media").delete(id)}catch(e){reject(e);return}
   tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error("delete-aborted"));tx.onerror=()=>reject(tx.error||Error("delete-failed"));
  });
  if(await readMediaRecord(id))throw Error("delete-readback");
  media.delete(id);mediaMeta.delete(id);audioBuffers.delete(id);
 });
 storageWrite=task;return task;
}
function buildBackupPayload(){
 return {schema:2,app:"word-garden",version:DATA.version,exportedAt:new Date().toISOString(),settings,
  media:[...media].map(([id,value])=>({id,value,source:mediaMeta.get(id)?.source||"legacy",duration:mediaMeta.get(id)?.duration||0,updatedAt:mediaMeta.get(id)?.updatedAt||null}))};
}
function exportBackup(){
 if(recordBusy()||characterJob||cloudBusy)return toast("저장 작업이 끝난 뒤 백업해 주세요.");
 const payload=buildBackupPayload();
 downloadBlob(new Blob([JSON.stringify(payload)],{type:"application/json"}),"word-garden-backup-"+new Date().toISOString().slice(0,10)+".json");
 toast("백업 파일에는 사진·목소리가 포함됩니다. 다운로드된 파일을 안전하게 보관하세요.");
}
const legacyIds=DATA.legacyWordIds||[];
const baseAudioKeys=["name:seol","name:chae","name:both","system:pair","system:again","system:test",...WORDS.flatMap(w=>["word:"+w.id,"phrase:"+w.id,...Object.keys(PROFILES).map(p=>"ask:"+w.id+":"+p)])];
const knownKeys=new Set([...baseAudioKeys,...WORDS.map(w=>"photo:"+w.id),...WORDS.filter(w=>w.category==="characters").map(w=>"character:"+w.id),...legacyIds.flatMap(id=>["photo:"+id,"word:"+id,"phrase:"+id,...Object.keys(PROFILES).map(p=>"ask:"+id+":"+p)]),
 ...DATA.aiVoices.flatMap(v=>baseAudioKeys.map(k=>"ai:"+v.id+":"+k))]);
function validateBackup(raw){
 if(!raw||raw.app!=="word-garden"||![1,2].includes(raw.schema)||!Array.isArray(raw.media)||raw.media.length>knownKeys.size)throw Error("invalid-backup");
 const ids=new Set(),rows=[];
 for(const m of raw.media){
  if(!m||!knownKeys.has(m.id)||ids.has(m.id)||typeof m.value!=="string"||m.value.length>8e6)throw Error("invalid-media");
  ids.add(m.id);
  if(m.id.startsWith("photo:")||m.id.startsWith("character:")){
   if(!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=\r\n]+$/.test(m.value))throw Error("invalid-photo");
  }else if(!/^data:audio\/(mp4|webm|ogg|wav|mpeg|x-wav|aac)(;codecs=[A-Za-z0-9.,_-]+)?;base64,[A-Za-z0-9+/=\r\n]+$/.test(m.value))throw Error("invalid-audio");
  const source=m.id.startsWith("ai:")?"ai":m.id.startsWith("character:")?"original":m.id.startsWith("photo:")?"photo":m.source==="parent"?"parent":"legacy";
  rows.push({id:m.id,value:m.value,source,duration:typeof m.duration==="number"&&m.duration>=0&&m.duration<120?m.duration:0,
    updatedAt:typeof m.updatedAt==="string"&&Number.isFinite(Date.parse(m.updatedAt))?m.updatedAt:new Date().toISOString(),verifiedAt:new Date().toISOString()});
 }
 return {settings:validateSettings(raw.settings),media:rows};
}
async function importBackupObject(raw,label="백업"){
 if(recordBusy()||pendingRecording||aiJob||characterJob)throw Error("busy");
 const parsed=validateBackup(raw);
 if(!confirm(`${label}의 ${parsed.media.length}개 사진·목소리와 설정을 이 기기에 불러올까요? 같은 항목은 교체하고 나머지는 유지합니다.`))return false;
 if(!db)await openDB();
 const task=storageWrite.catch(()=>{}).then(async()=>{
  await commitRecords(parsed.media);
  for(const row of parsed.media){
   const check=await readMediaRecord(row.id);if(!check||check.value!==row.value)throw Error("backup-readback");
  }
  for(const row of parsed.media){media.set(row.id,row.value);mediaMeta.set(row.id,row)}
 });
 storageWrite=task;await task;
 settings=parsed.settings;saveSettings();audioBuffers.clear();AudioEngine.initVoices();
 return true;
}
async function importBackupFile(f){
 if(recordBusy()||pendingRecording||aiJob||characterJob||cloudBusy)throw Error("busy");
 if(f.size>180*1024*1024)throw Error("too-large");
 return importBackupObject(JSON.parse(await f.text()),"백업 파일");
}
function cloudToken(){return String($("#cloud-token")?.value||localStorage.getItem(CLOUD_TOKEN_KEY)||"").trim()}
function cloudLastLabel(){
 const raw=localStorage.getItem(CLOUD_LAST_KEY);if(!raw)return "이 기기에서 아직 없음";
 const d=new Date(raw);return Number.isFinite(d.getTime())?d.toLocaleString("ko-KR"):"이 기기에서 아직 없음";
}
async function cloudGrant(action,token){
 const r=await fetch("/api/cloud-backup",{method:"POST",headers:{"Content-Type":"application/json","X-Parent-Token":token},body:JSON.stringify({action}),cache:"no-store"});
 let data={};try{data=await r.json()}catch{}
 if(!r.ok){const e=Error(data.error||"cloud-unavailable");e.status=r.status;throw e}
 return data;
}
async function cloudSave(){
 if(cloudBusy||recordBusy()||pendingRecording||aiJob||characterJob)return toast("다른 저장 작업이 끝난 뒤 다시 눌러주세요.");
 const token=cloudToken();if(token.length<32)return toast("Vercel의 WORD_GARDEN_PARENT_TOKEN 값을 32자 이상 입력해 주세요.");
 const payload=buildBackupPayload(),blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
 if(blob.size>180*1024*1024)return toast("백업이 180MB를 넘어요. 먼저 로컬 백업 파일을 저장해 주세요.");
 cloudBusy=true;cloudMessage="클라우드 업로드 준비 중…";renderOffline();
 try{
  const grant=await cloudGrant("put",token);cloudMessage=`클라우드에 ${Math.max(1,Math.round(blob.size/1024))}KB 저장 중…`;renderOffline();
  const up=await fetch(grant.presignedUrl,{method:"PUT",headers:{"Content-Type":"application/json"},body:blob});
  if(!up.ok)throw Error("cloud-upload-failed");
  const now=new Date().toISOString();localStorage.setItem(CLOUD_TOKEN_KEY,token);localStorage.setItem(CLOUD_LAST_KEY,now);

function downloadBlob(blob,name){

 a.href=url;a.download=name;document.body.append(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function audioExtension(type){return /mp4|aac/i.test(type)?"m4a":/mpeg|mp3/i.test(type)?"mp3":/wav/i.test(type)?"wav":/ogg/i.test(type)?"ogg":"webm"}

async function startRecording(key,text){
 if(recordBusy()||pendingRecording)return;
 if(!storageOK||!db)return toast("저장소가 준비되지 않았어요. 저장·백업에서 저장소 다시 연결을 눌러주세요.");

 recordState="acquiring";recordPending=true;recordError="";lastRecordingKey=null;

 let stream;

  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
  if(!$("#parents-dialog").open||document.hidden){stream.getTracks().forEach(t=>t.stop());recordState="idle";return}
  const supported=t=>typeof MediaRecorder.isTypeSupported==="function"&&MediaRecorder.isTypeSupported(t);
  const type=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"].find(supported);
  const recorder=new MediaRecorder(stream,type?{mimeType:type,audioBitsPerSecond:96000}:undefined);

   recording=null;
   if(rec.failed||blob.size<150||duration<.35){
    recordState="error";recordError=rec.failed?"녹음 중 오류가 발생했어요. 기존 녹음은 유지합니다.":"녹음이 너무 짧거나 비어 있어요. 1초 이상 다시 녹음해 주세요.";

   }

async function prepareAIPack(entries){
 if(aiJob||recordBusy()||pendingRecording)return;
 if(!storageOK||!db)return toast("먼저 기기 저장소를 연결해 주세요.");
 if(!navigator.onLine)return toast("AI 음성을 처음 준비할 때에는 인터넷이 필요합니다.");
 if(aiToken.length<32)return toast("Vercel에 설정한 32자 이상의 부모 생성 암호를 입력해 주세요.");
 const voice=settings.aiVoice;
 const missing=entries.filter(([key])=>!media.has("ai:"+voice+":"+key));
 if(!missing.length){toast("선택한 음성은 모두 준비되어 있어요.");return}
 const msg=`${voice} 목소리 ${missing.length}개를 생성하고 이 기기에 저장할까요?\n\n낱말·문장(이름 인사와 질문을 포함하는 경우 아이 이름)이 OpenAI로 전달되고 API 사용료가 발생합니다.\n부모 녹음은 보내거나 덮어쓰지 않습니다.`;
 if(!confirm(msg))return;
 aiJob={voice,total:missing.length,done:0};aiCancel=false;aiMessage="음성 준비를 시작합니다…";renderVoices();
 try{
  for(const [key,text] of missing){
   if(aiCancel)break;
   $("#ai-progress").textContent=`${aiJob.done}/${aiJob.total}개 저장됨 · “${text}” 준비 중`;
   const response=await fetch("/api/speech",{method:"POST",headers:{"Content-Type":"application/json","X-Parent-Token":aiToken},body:JSON.stringify({voice,key}),cache:"no-store",signal:AbortSignal.timeout?AbortSignal.timeout(45000):undefined});
   if(!response.ok){
    const details=await response.json().catch(()=>({}));
    const errors={401:"부모 생성 암호가 맞지 않습니다.",403:"이 주소에서 음성을 만들 수 없습니다.",404:"AI 생성 서버를 찾지 못했어요. api 폴더도 배포했는지 확인하세요.",429:"요청 또는 API 한도를 확인한 뒤 다시 시도하세요.",503:"Vercel의 두 환경변수를 설정하고 재배포해 주세요."};
    throw new Error(errors[response.status]||details.error||"음성을 생성하지 못했습니다.");
   }
   const blob=await response.blob();
   if(!blob.type.startsWith("audio/")||blob.size<100||blob.size>3000000)throw Error("올바른 음성 파일을 받지 못했어요.");
   const uri=await blobToDataURL(blob);
   await putMedia("ai:"+voice+":"+key,uri,{source:"ai",bytes:blob.size,mime:blob.type});
   aiJob.done++;
  }
  aiMessage=aiCancel?`${aiJob.done}개 저장 후 멈췄습니다. 다시 누르면 부족한 음성만 준비합니다.`:`${aiJob.done}개 음성을 저장하고 다시 읽어 확인했습니다.`;
 }catch(e){aiMessage=`${aiJob.done}개 저장됨 · ${e.name==="TimeoutError"?"서버 응답 시간이 초과됐어요.":e.message} 저장된 파일은 유지되며 다시 시도할 수 있습니다.`}
 finally{aiJob=null;renderVoices()}
}

function sessionAudio(){
 const w=session.deck[session.index];
 if(session.mode==="find")return AudioEngine.say(`${profile().call}, ${w.label} 어디 있을까?`,"ask:"+w.id+":"+settings.profile);
 if(session.mode==="pair")return AudioEngine.say("같은 그림을 찾아볼까?","system:pair");
 if(session.mode==="phrase")return AudioEngine.say(w.phrase,"phrase:"+w.id);
 return AudioEngine.say(w.label,"word:"+w.id);
}
function startSession(){
 const pool=playWords(settings.category);
 if(settings.category==="characters"&&!pool.length){toast("부모 → 캐릭터에서 직접 이미지를 넣어주세요.");return}
 if(!pool.length){toast("이 주제에는 아직 사진이 없어요. 부모 설정에서 캐릭터 사진을 넣어주세요.");return}
 if(["find","pair"].includes(settings.mode)&&pool.length<2){toast("찾기 놀이는 사진 카드가 두 장 이상 있어야 해요. 먼저 낱말 보기로 놀아주세요.");return}
 AudioEngine.unlock();AudioEngine.stop();
 const deck=shuffled(pool).slice(0,settings.count);
 session={deck,pool,index:0,mode:settings.mode,elapsed:0,lastTick:performance.now(),paused:false,seen:new Set(),choices:[],answer:false,pictureOverride:null,finished:false,endedByTimer:false};
 prepareRound();renderPlay();
 AudioEngine.warm(["name:"+settings.profile,"system:pair","system:again",...deck.flatMap(w=>["word:"+w.id,"phrase:"+w.id,"ask:"+w.id+":"+settings.profile])]);
 if(settings.mode==="find"||settings.mode==="pair"){if(settings.autoRead)sessionAudio()}
 else AudioEngine.say(`${profile().call}, 같이 놀자.`,"name:"+settings.profile);
}
function prepareRound(){
 const w=session.deck[session.index];session.seen.add(w.id);session.answer=false;session.pictureOverride=null;
 const alternatives=shuffled(session.pool.filter(c=>c.id!==w.id)).slice(0,settings.choices-1);
 session.choices=shuffled([w,...alternatives]);session.feedback="";
}
function renderPlay(){
 if(!session||session.finished)return;appScreen="play";const w=session.deck[session.index],find=["find","pair"].includes(session.mode);
 const title=session.mode==="find"?`${w.label} 어디 있을까?`:session.mode==="pair"?"같은 그림을 찾아볼까?":session.mode==="phrase"?"두 낱말을 함께 말해요":"톡 누르면 낱말이 들려요";
 el.innerHTML=`<div class="play-app"><header class="play-top"><button class="icon-btn" id="pause-home" aria-label="놀이 잠깐 멈추기">${icon("home",21)}</button><div class="play-title">${profile().short==="함께"?"은설 · 은채":profile().short}의 ${modeName(session.mode)}<small>${CATS.find(c=>c.id===w.category).label} · 부모와 함께 천천히</small></div>${parentButton()}</header>
 <div class="progress-dots" role="img" aria-label="${session.deck.length}장 중 ${session.index+1}번째 카드">${session.deck.map((_,i)=>`<span class="${i<session.index?"done":i===session.index?"current":""}"></span>`).join("")}</div>
 <section class="play-body"><h1 class="play-heading">${title}</h1>
 ${find?`${session.mode==="pair"?`<div class="match-target" aria-label="이 그림과 같은 것을 찾아요">${picture(w,session.pictureOverride)}</div>`:""}<div class="choice-grid ${session.choices.length===3?"three":""}">${session.choices.map(c=>`<button class="choice ${session.answer&&c.id===w.id?"correct":""}" data-answer="${c.id}" aria-label="${esc(c.label)} 선택">${picture(c,session.pictureOverride)}${settings.showLabels?`<span class="word-label">${c.label}</span>`:""}</button>`).join("")}</div><div class="feedback" id="feedback" role="status">${session.feedback||"&nbsp;"}</div>`:

 <div class="audio-source" id="audio-source" role="status"></div><div class="play-subcontrols">${w.category!=="characters"&&photoFor(w)&&!find?`<button class="text-btn" id="picture-swap">${icon("swap",15)} ${shouldPhoto(w,session.pictureOverride)?"그림으로 보기":"사진으로 보기"}</button>`:""}<button class="text-btn" id="pause">${icon("pause",14)} 잠깐 쉬기</button></div>
 </section></div>`;
 bindParentButton();$("#repeat").onclick=sessionAudio;
 if($("#big-card"))$("#big-card").onclick=sessionAudio;
 $("#next").onclick=()=>nextRound(1);$("#previous").onclick=()=>nextRound(-1);
 $("#pause").onclick=()=>pauseSession();$("#pause-home").onclick=()=>pauseSession();
 if($("#picture-swap"))$("#picture-swap").onclick=()=>{session.pictureOverride=!shouldPhoto(w,session.pictureOverride);renderPlay()};
 $$("[data-answer]").forEach(b=>b.onclick=()=>answer(b.dataset.answer,b));
}
function answer(id,button){
 if(!session||session.answer)return;
 const w=session.deck[session.index];AudioEngine.unlock();
 if(id===w.id){
  session.answer=true;session.feedback=`${w.label}, 여기 있네!`;
  button.classList.add("correct");$("#feedback").textContent=session.feedback;
  const next=$("#next");if(next){next.disabled=false;next.removeAttribute("aria-disabled")}
  AudioEngine.say(w.label,"word:"+w.id);
 }else{
  button.classList.add("soft");setTimeout(()=>button.classList.remove("soft"),450);
  $("#feedback").textContent="같이 한 번 더 살펴볼까?";
  AudioEngine.say("같이 한 번 더 살펴볼까?","system:again");
 }
}
function nextRound(direction){
 if(!session)return;
 if(direction>0&&["find","pair"].includes(session.mode)&&!session.answer){toast("그림을 하나 골라야 다음 카드로 갈 수 있어요.");return}
 AudioEngine.unlock();AudioEngine.stop();
 if(direction>0&&session.timeNotified){finishSession(true);return}
 if(direction<0&&session.index===0)return;
 if(direction>0&&session.index>=session.deck.length-1){finishSession();return}
 session.index+=direction;prepareRound();renderPlay();if(settings.autoRead)sessionAudio();
}
function pauseSession(){
 if(!session||session.finished)return;session.paused=true;AudioEngine.stop();
 const d=$("#pause-dialog");d.innerHTML=`<div class="pause-dialog"><div class="ending-symbol">🌿</div><h2>잠깐 쉬어갈까요?</h2><p>서두르지 않아도 괜찮아요.<br>아이와 눈을 맞추고 이야기해 주세요.</p><div class="btn-row"><button class="primary" id="resume-play">계속 놀기</button><button class="secondary" id="end-play">이제 마무리</button></div></div>`;
 d.showModal();$("#resume-play").onclick=()=>{d.close();session.paused=false;session.lastTick=performance.now();AudioEngine.unlock()};
 $("#end-play").onclick=()=>{d.close();finishSession()};
}
function finishSession(byTimer=false){
 if(!session||session.finished)return;session.finished=true;session.paused=true;session.endedByTimer=byTimer;AudioEngine.stop();

async function resizePhoto(blob){
 if(blob.size>20*1024*1024)throw Error("too-big");
 const url=URL.createObjectURL(blob);
 try{
  const img=new Image();img.src=url;await img.decode();if(!img.naturalWidth||img.naturalWidth*img.naturalHeight>60e6)throw Error("too-big");
  const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=c.getContext("2d");if(!ctx)throw Error("canvas-unavailable");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.94);
 }finally{URL.revokeObjectURL(url)}
}
$("#image-input").onchange=async e=>{
 const f=e.target.files?.[0],action=pendingFileAction;if(!f||!action)return;
 try{const uri=await resizePhoto(f);await putMedia("photo:"+action.id,uri);if(editId===action.id)renderEditor();toast("사진을 저장했어요. 인터넷 없이도 볼 수 있어요.")}
 catch(err){toast(err.message==="too-big"?"사진은 20MB 이하로 골라주세요.":"사진을 저장하지 못했어요. JPG 또는 PNG 사진으로 다시 선택해 주세요.")}
 pendingFileAction=null;
};

 <div class="health-row"><span>이 기기의 마지막 클라우드 백업</span><strong>${esc(cloudLastLabel())}</strong></div>
 <p id="cloud-status" class="soft-note" role="status">${esc(cloudMessage||"처음 사용 시 Vercel 프로젝트에 Private Blob을 한 번 연결해야 합니다.")}</p>
 <p>클라우드에서 불러오기는 현재 기기의 같은 항목을 교체하고, 없는 항목은 유지합니다. 중요한 녹음은 기기 파일 백업도 함께 보관하세요.</p></section>
 <section class="setting-block"><h3>업데이트와 실제 확인</h3><p>같은 운영 주소를 계속 사용하세요. 업데이트를 위해 Safari 데이터를 지우거나 앱을 삭제하지 마세요. 먼저 백업을 받으세요.</p>
 <div class="btn-row"><button class="secondary" id="check-update">새 버전 확인</button><button class="secondary" id="offline-voice">이름 소리 확인</button></div>
 <p>비행기 모드로 전환한 뒤 앱을 닫았다 다시 열어 그림과 소리를 확인하세요. 0ms 지연은 보장하지 않습니다.</p></section>`;
 $("#check-offline").onclick=async()=>{await checkCache();renderOffline();toast(coreReady?"앱·일반 그림 220장·캐릭터 원본 24장의 캐시를 확인했어요. 음성은 별도로 확인해주세요.":"온라인 상태로 다시 열어 저장을 기다려주세요.")};
 $("#reconnect-storage").onclick=async()=>{try{if(db)db.close();db=null;await openDB();renderOffline();toast("저장소를 다시 연결했습니다.")}catch{toast("저장소를 열지 못했어요. 일반 Safari 또는 홈 화면 앱에서 다시 확인해 주세요.")}};
 $("#persist-storage").onclick=async()=>{
  let ok=false;try{ok=await navigator.storage?.persist?.()}catch{}
  $("#persistence-status").textContent=ok?"저장 유지가 허용되었습니다. 직접 데이터 삭제는 막지 못하므로 백업도 보관하세요.":"저장 유지가 허용되지 않았거나 지원되지 않습니다. 백업 파일을 보관하세요.";
 };
 $("#export-backup").onclick=exportBackup;
 $("#import-backup").onclick=()=>{const f=$("#backup-input");f.value="";f.click()};
 $("#cloud-save").onclick=cloudSave;
 $("#cloud-restore").onclick=cloudRestore;
 $("#check-update").onclick=async()=>{
  try{const reg=await navigator.serviceWorker.getRegistration();await reg?.update();toast("업데이트를 확인했어요. 저장이 끝나면 앱을 완전히 닫았다 다시 열어주세요.")}catch{toast("온라인 상태에서 업데이트를 확인해 주세요.")}
 };
 $("#offline-voice").onclick=()=>AudioEngine.say(`${profile().call}, 같이 놀자.`,"name:"+settings.profile);
}


function renderGuide(){
 $("#parent-content").innerHTML=`<section class="setting-block"><h3>함께 보고, 듣고, 말하기</h3><p>아이를 고르고 주제와 놀이를 선택하세요. 큰 그림을 누르면 낱말을 읽습니다. 정답·속도보다 함께 나누는 말이 먼저입니다.</p><p>아이의 발음을 자동 평가하거나 녹음·전송하지 않습니다. 부모님이 녹음 시작을 누른 동안만 마이크를 사용합니다.</p></section>
 <section class="setting-block"><h3>녹음은 항목별로 적용됩니다</h3><p>‘사과’ 녹음은 낱말 보기에, ‘빨간 사과’ 녹음은 두 낱말에, ‘은설아, 사과 어디 있을까?’ 녹음은 은설의 듣고 찾기에 적용됩니다. 이름 인사는 별도 녹음입니다.</p><p>저장 완료 후 직접 재생하고, 중요한 녹음은 저장·백업에서 기기 파일 또는 가족 클라우드에 보관하세요.</p></section>
 <section class="setting-block"><h3>음성 선택</h3><p>부모 녹음 → 준비된 AI 음성팩 → 기기의 한국어 합성음성 순서입니다. AI 준비는 부모님이 명시적으로 실행한 경우에만 인터넷을 사용합니다. 아이의 놀이 중에 API를 호출하지 않습니다.</p></section>
 <section class="setting-block"><h3>기억해 주세요</h3><p>이 앱은 지능 향상·언어 발달 효과를 보장하거나 발달을 평가하지 않습니다. 3분은 앱의 기본 설정입니다. 화면에서 본 물건을 실제 생활에서 함께 찾아보세요.</p><p>캐릭터는 확인한 원본 또는 부모가 등록한 이미지를 사용합니다. 캐릭터 탭에서 출처와 저장 상태를 확인해주세요.</p></section>`;
}

function showHelp(){
 const d=$("#help-dialog");d.innerHTML=`<header class="dialog-head"><h2>설치와 첫 사용</h2><button class="icon-btn" id="close-help" aria-label="안내 닫기">${icon("close",20)}</button></header><div class="dialog-body"><section class="setting-block"><h3>아이폰 · 아이패드는 Safari에서</h3><p>배포된 HTTPS 주소를 열고 공유 → 홈 화면에 추가를 눌러주세요. 새 아이콘으로 온라인에서 한 번 열어 ‘화면 저장됨’을 확인한 뒤 비행기 모드로 시험해 보세요.</p><div class="notice">현재 전달된 HTML 파일은 컴퓨터 미리보기용이에요. ZIP 안의 파일을 HTTPS 웹호스팅에 올려야 아이폰 설치 주소가 생겨요.</div></section><section class="setting-block"><h3>아이 화면은 기기에 맞춰 안정적으로 고정돼요</h3><p>더블탭 확대를 막고, iPhone·iPad의 Safe Area와 현재 세로/가로 방향을 기준으로 화면 높이와 폭을 안정적으로 유지합니다. 부모 입력창도 iOS가 임의로 확대하지 않도록 16px 이상으로 맞췄어요.</p></section><section class="setting-block"><h3>녹음과 합성음성은 따로 확인해요</h3><p>부모 녹음, 준비한 AI 음성팩, 기기에서 제공하는 한국어 음성을 사용합니다. AI 음성팩은 ‘음성 선택’에서 필요한 주제를 먼저 준비하세요. 부모 설정을 1.2초 눌러 ‘저장·백업’ 탭에서 확인해 주세요.</p><p>첫 실행이나 오디오 기기에 따라 소리가 시작될 때 짧은 지연이 생길 수 있어요. 실제 아이폰·아이패드에서 마지막 확인이 필요합니다.</p></section></div>`;d.showModal();$("#close-help").onclick=()=>d.close();
}

$("#backup-input").onchange=async e=>{
 const f=e.target.files?.[0];if(!f)return;
 try{if(await importBackupFile(f)){renderOffline();toast("백업을 저장소에서 다시 읽어 확인했습니다.")}}
 catch(e){toast(e.message==="too-large"?"백업 파일이 180MB를 넘어요.":"백업을 불러오지 못했어요. 앱에서 만든 파일인지, 저장 공간이 충분한지 확인해 주세요.")}
};

async function checkCache(){
 if(window.WORD_GARDEN_PREVIEW){coreReady=false;cacheState="failed";return}
 if(!("caches"in window)){cacheState="failed";coreReady=false;return}
 try{
  const cache=await caches.open(SW_VERSION);const needed=[...new Set(["./index.html","./manifest.webmanifest","./icon-192.png","./icon-512.png","./apple-touch-icon.png",...WORDS.map(w=>"./"+w.art)])];
  const results=await Promise.all(needed.map(u=>cache.match(new URL(u,location.href).href)));
  coreReady=results.every(Boolean)&&!!navigator.serviceWorker?.controller;cacheState=coreReady?"ready":"failed";
 }catch{coreReady=false;cacheState="failed"}
 const c=$("#cache-chip");if(c){c.textContent=cacheLabel();c.classList.toggle("pending",!coreReady)}
}
async function installWorker(){
 if(window.WORD_GARDEN_PREVIEW||location.protocol==="file:"||!window.isSecureContext||!("serviceWorker"in navigator)){cacheState="failed";const c=$("#cache-chip");if(c)c.textContent=cacheLabel();return}
 try{
  await navigator.serviceWorker.register("./sw.js",{scope:"./",updateViaCache:"none"});
  navigator.serviceWorker.addEventListener("controllerchange",()=>{checkCache()});
  await navigator.serviceWorker.ready;await checkCache();
 }catch{cacheState="failed";await checkCache()}
}
$("#parents-dialog").addEventListener("cancel",e=>{e.preventDefault();closeParents()});
$("#pause-dialog").addEventListener("cancel",e=>{e.preventDefault();if(session){$("#pause-dialog").close();session.paused=false;session.lastTick=performance.now()}});
window.addEventListener("pagehide",()=>{AudioEngine.stop();if(recording)stopRecording()});
window.addEventListener("beforeunload",e=>{if(recordBusy()||pendingRecording||characterJob){e.preventDefault();e.returnValue=""}});
window.addEventListener("online",()=>checkCache());
window.addEventListener("offline",()=>checkCache());
if("speechSynthesis"in window){speechSynthesis.addEventListener("voiceschanged",()=>{AudioEngine.initVoices();if(parentTab==="voices"&&$("#parents-dialog").open&&!aiJob&&!recordBusy())renderVoices()})}
window.addEventListener("keydown",e=>{
 if($("dialog[open]")||appScreen!=="play")return;
 if(e.key==="ArrowRight"){e.preventDefault();nextRound(1)}
 if(e.key==="ArrowLeft"){e.preventDefault();nextRound(-1)}
 if(e.code==="Space"){e.preventDefault();sessionAudio()}
 if(e.key==="Escape")pauseSession();
});
(async()=>{
 try{
  // A missing device voice must not prevent the home screen from opening.
  try{AudioEngine.initVoices()}catch{AudioEngine.voices=[];AudioEngine.voice=null}
  try{await openDB()}catch{storageOK=false}
  renderHome();
  window.wordGardenBoot?.ready();
  installWorker();
 }catch(error){
  window.wordGardenBoot?.fail(error);
 }
})();
// Exposed read-only diagnostics for testing and troubleshooting; no private data is sent.
window.wordGardenDiagnostics=()=>({screen:appScreen,readyCards:readyWords().length,localVoices:AudioEngine.voices.length,coreReady,storageOK,version:DATA.version,characterImages:characterCount(),mediaCount:media.size,recordState,unsavedRecording:!!pendingRecording,lastAudioSource:AudioEngine.lastSource});
